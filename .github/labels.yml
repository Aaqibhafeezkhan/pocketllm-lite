# Label definitions for PocketLLM Lite. Sync with a label-sync action or:
#   gh label create "<name>" --color <hex> --description "<text>" --force
- name: good first issue
  color: 7057ff
  description: Small, self-contained, with context and acceptance criteria
- name: help wanted
  color: 008672
  description: Maintainers would welcome a contribution
- name: compatibility
  color: 0e8a16
  description: Device or model compatibility report
- name: area:android
  color: 1d76db
  description: Flutter app
- name: area:web
  color: 1d76db
  description: Web Edition and marketing site
- name: area:rag
  color: 1d76db
  description: Documents, retrieval, citations
- name: area:network
  color: 1d76db
  description: Network policy, Strict Offline, audit log
- name: area:api
  color: 1d76db
  description: Embedded OpenAI-compatible server
- name: area:l10n
  color: 1d76db
  description: Localization
- name: area:a11y
  color: 1d76db
  description: Accessibility
- name: difficulty:starter
  color: c5def5
  description: A few hours, minimal context needed
- name: difficulty:intermediate
  color: bfd4f2
  description: A day or two, touches several files
- name: difficulty:advanced
  color: 5319e7
